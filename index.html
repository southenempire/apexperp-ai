<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="apple-touch-icon" href="/brand/mark-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ApexPerp guards your dreamDEX perps on Somnia from liquidation with automatic reduce-only trims." />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash.
      try {
        var t = localStorage.getItem('apexperp:theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>ApexPerp: liquidation guard for dreamDEX perps</title>
    <meta property="og:title" content="ApexPerp: get trimmed, not liquidated" />
    <meta property="og:description" content="Liquidation guard for dreamDEX perps on Somnia. See how close you are, and set on-chain stops that trim before liquidation." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A0A09" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
